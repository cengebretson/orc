# Optional Orc bindings. Copy the bindings you want into ~/.tmux.conf.
# Replace this placeholder with the absolute path to your Orc workspace.
set-environment -g ORC_WORKSPACE "/absolute/path/to/orc-workspace"

# prefix + W: toggle the managed watch rail in a 64-column right split.
bind-key W run-shell 'orc --workspace "$ORC_WORKSPACE" rail toggle --layout right --size 64'

# prefix + C: keep the rail alive while toggling between compact and full size.
bind-key C run-shell 'orc --workspace "$ORC_WORKSPACE" rail toggle-collapsed'

# prefix + P: open the wide watch dashboard in a popup; q closes it.
bind-key P display-popup -E -d "#{pane_current_path}" -w 90% -h 80% 'exec orc --workspace "$ORC_WORKSPACE" watch --wide'

# prefix + S: inspect managed and recent provider sessions in a popup.
bind-key S display-popup -E -d "#{pane_current_path}" -w 90% -h 80% 'orc --workspace "$ORC_WORKSPACE" sessions --all | ${PAGER:-less} -R'

# prefix + R: search for and resume a provider session inside a popup.
bind-key R display-popup -E -d "#{pane_current_path}" -w 90% -h 80% 'exec orc --workspace "$ORC_WORKSPACE" sessions resume'

# prefix + F: jump to the highest-priority live session needing attention.
bind-key F run-shell 'orc --workspace "$ORC_WORKSPACE" focus'

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Verify release contract
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/release-contract "${RUNNER_TEMP}/release-notes.md"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version-file: .tool-versions
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release body is the one artifact no local gate can check: snapshot
      # mode never renders one. This detects a bad body rather than preventing
      # it, so a failure here means the release is public and needs repairing.
      - name: Verify published release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-release-published "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release-notes.md"

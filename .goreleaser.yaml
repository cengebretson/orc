version: 2

project_name: orc

builds:
  - main: ./cmd/orc
    binary: orc
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Tag}} -X main.buildDate={{ .Now.Format "2006-01-02" }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Release notes come from CHANGELOG.md via --release-notes in the Release
# workflow. Do not set `changelog.disable` here: disabling skips the changelog
# pipe entirely, and that pipe is what reads --release-notes into the release
# body. Every release through v0.17.0 shipped with empty notes for that reason.
# The pipe returns early once --release-notes is set, so no git-log changelog
# is generated or appended.
changelog:
  use: git

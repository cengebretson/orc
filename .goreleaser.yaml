version: 2

project_name: orc

builds:
  - main: ./cmd/orc
    binary: orc
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Release notes come from CHANGELOG.md via --release-notes in the Release workflow.
changelog:
  disable: true

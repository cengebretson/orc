# orc.yaml — workspace configuration
#
# Single config file for repos, workflows, and workspace settings.
# Run `orc doctor` to verify the workspace.
# After editing, the dashboard picks up changes on the next auto-refresh.

# settings:
#   default_workflow: default     # workflow used by `orc work` when --workflow is omitted
#   artifact_policy: warn         # warn or block when feature artifacts are missing at stage completion
#   auto_archive: false           # archive tickets automatically when the last stage completes
#   auto_tmux: false              # always use tmux for new tickets (same as orc work --tmux)
#   auto_next: false              # always launch the first stage after orc work (same as orc work --next)
#   workspace_refresh: 60         # Workspace dashboard refresh interval in seconds (default: 60)
#   theme: catppuccin-mocha       # Dashboard color theme (default: catppuccin-mocha)
#   context_pressure:             # live provider context percentage color boundaries
#     green: 0
#     yellow: 70
#     red: 90
#   notify:                       # optional best-effort transition hook
#     on: [blocked, complete]
#     command: "notify-send 'orc' '{{ticket}} {{event}}'"
#   herdr:                        # optional native Herdr task-cell layout
#     task_cell:
#       test_command: "make test" # right-side test pane; any shell command
#       watch: true               # right-side `orc watch <ticket>` pane

settings:
  default_workflow: default
  artifact_policy: warn
  quotes:
    - "Mmm... human burgers!"
    - "Do we get fries with that?"
    - "We eat you for lunch!"
    - "Trolls rule!"
    - "We will break you!"
    - "We are not amused!"
    - "Don't... make... me... MAD!"
    - "I'M...GETTING...ANGRY!!!"
    - "Hey! What did I ever do to you?"
    - "Oh no! Smack a Troll!"
    - "Ha! My trolls will stop you!"
    - "No. No! NOOOOOOOOOOOOOOOO!!!!!!!!"
    - "BOOMSHAKALAKA!"
    - "You think this is funny?"
    - "I'm gonna make you look like an accident."
    - "That's right! Rule the universe!"
    - "Trolls. Get him. Go! Now!"

repos:
  - name: my-app
    # SETUP.md replaces this placeholder with the discovered absolute path.
    path: /absolute/path/to/my-app
    purpose: Application code, APIs, tests
    # Optional: repo-specific hints shown in `orc next` launch prompts.
    # agent_hints:
    #   - Use the repo Makefile before direct tool commands.
    # Optional: use when this repo needs setup beyond raw git worktree add.
    # Supported placeholders: {{branch}}, {{worktree_path}}, {{repo_path}},
    # {{repo_name}}, {{ticket}}, {{slug}}, {{workspace}}.
    # worktree_setup: "{{repo_path}}/scripts/setup-worktree.sh -b {{branch}} --path {{worktree_path}}"

# Optional deterministic repository routes based on ticket metadata. Ticket ID
# prefixes identify ticket namespaces, not code ownership, so they are not used
# here. Each route selects one repo or an explicit cross-repo set. Signals must
# be unique across routes. Exactly one matching rule is required; multiple
# matches are ambiguous and intake pauses. Purpose and ticket content are the
# fallback when no route matches. Workflow selection stays independent.
# routing:
#   - labels: [application]
#     components: [web]
#     repos: [my-app]
#   - labels: [full-stack]
#     repos: [my-app, shared-api]

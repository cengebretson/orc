---
name: default
description: General feature workflow — intake → develop → PR → QA
schema: 1                     # worker/workflow frontmatter schema version
engines: [claude, codex]      # engines this pack's workers are written for
provides:
  workflows:
    - id: default:standard
      path: workflow.yaml
      description: General feature workflow
    - id: default:adhoc
      path: workflow.yaml
      description: Standalone local work
  workers:
    - id: default:bob
      path: workers/bob.md
      description: Implementation worker
    - id: default:fred
      path: workers/fred.md
      description: Intake and documentation worker
    - id: default:zach
      path: workers/zach.md
      description: Code review worker
    - id: default:brian
      path: workers/brian.md
      description: QA automation worker
    - id: default:ada
      path: workers/ada.md
      description: Architecture worker
  stages:
    - id: default:adhoc
      path: stages/adhoc.md
      description: Complete a standalone local task
    - id: default:intake
      path: stages/intake.md
      description: Gather ticket context
    - id: default:develop
      path: stages/develop.md
      description: Implement the change
    - id: default:code-review
      path: stages/code-review.md
      description: Review implementation
    - id: default:pr-open
      path: stages/pr-open.md
      description: Open the pull request
    - id: default:pr-repair
      path: stages/pr-repair.md
      description: Repair PR feedback and CI failures
    - id: default:qa-automation
      path: stages/qa-automation.md
      description: Add or run automated QA
aliases:
  workflows:
    adhoc: default:adhoc
    default: default:standard
  workers:
    bob: default:bob
    fred: default:fred
    zach: default:zach
    brian: default:brian
    ada: default:ada
  stages:
    adhoc: default:adhoc
    intake: default:intake
    develop: default:develop
    code-review: default:code-review
    pr-open: default:pr-open
    pr-repair: default:pr-repair
    qa-automation: default:qa-automation

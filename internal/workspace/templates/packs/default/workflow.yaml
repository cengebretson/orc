workflows:
  "default:standard":
    description: General feature workflow — intake → develop → PR → QA
    stages:
      - name: default:intake
        worker: default:fred
        advance: auto
        required_artifacts:
          - TICKET.md
          - SPEC.md
          - PLAN.md
      - name: default:develop
        worker: default:bob
        advance: manual
        required_artifacts:
          - PLAN.md
          - develop/HANDOFF.md
        loop:
          via: default:code-review
          worker: default:zach
          max: 3
          on_max: pause    # pause for human review when loop limit is reached
          required_artifacts:
            - code-review/REVIEW.md
      - name: default:pr-open
        worker: default:bob
        advance: manual
        required_artifacts:
          - pr-open/PR.md
        loop:
          via: default:pr-repair
          worker: default:bob
          max: 3
          on_max: pause    # pause for human review when loop limit is reached
          required_artifacts:
            - pr-repair/ci-failures.md
      - name: default:qa-automation
        worker: default:brian
        advance: auto
        required_artifacts:
          - qa-automation/PLAN.md
          - qa-automation/RUNS.md
          - qa-automation/RESULT.md
